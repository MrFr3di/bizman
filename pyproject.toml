[project]
name = "bizman"
version = "0.1.0"
description = "Deterministic evidence and state platform for BizMania"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format]>=4.26,<5",
    "websockets>=17.1,<18",
]

[project.scripts]
bizman = "bizman.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "import-linter==2.15",
]

[tool.uv]
required-version = "==0.12.10"

[tool.ruff]
target-version = "py311"
line-length = 100
