[project]
name = "bizman"
version = "0.1.0"
description = "Deterministic evidence and state platform for BizMania"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format]>=4.26,<5",
    "websockets>=17.1,<18",
]

[project.scripts]
bizman = "bizman.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "import-linter==2.15",
]

[tool.uv]
required-version = "==0.12.10"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bizman/changes/diff.py" = ["F401"]
"src/bizman/collector/network.py" = ["F401"]

[tool.importlinter]
root_package = "bizman"

[[tool.importlinter.contracts]]
name = "Foundation is a dependency leaf"
type = "forbidden"
source_modules = ["bizman.foundation"]
forbidden_modules = [
    "bizman.sessions",
    "bizman.collector",
    "bizman.changes",
    "bizman.core",
    "bizman.cli",
]

[[tool.importlinter.contracts]]
name = "Sessions do not depend on higher layers"
type = "forbidden"
source_modules = ["bizman.sessions"]
forbidden_modules = [
    "bizman.collector",
    "bizman.changes",
    "bizman.core",
    "bizman.cli",
]

[[tool.importlinter.contracts]]
name = "Collector is independent from detector and application layers"
type = "forbidden"
source_modules = ["bizman.collector"]
forbidden_modules = [
    "bizman.sessions",
    "bizman.changes",
    "bizman.core",
    "bizman.cli",
]

[[tool.importlinter.contracts]]
name = "Changes do not depend on collector or application layers"
type = "forbidden"
source_modules = ["bizman.changes"]
forbidden_modules = [
    "bizman.collector",
    "bizman.core",
    "bizman.cli",
]

[[tool.importlinter.contracts]]
name = "Core does not depend on CLI"
type = "forbidden"
source_modules = ["bizman.core"]
forbidden_modules = ["bizman.cli"]

[[tool.importlinter.contracts]]
name = "CLI directly consumes Core only"
type = "forbidden"
source_modules = ["bizman.cli"]
forbidden_modules = [
    "bizman.foundation",
    "bizman.sessions",
    "bizman.collector",
    "bizman.changes",
]
allow_indirect_imports = true
