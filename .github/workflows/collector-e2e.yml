name: collector-quality-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "schemas/**"
      - "config/**"
      - "knowledge/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/CI.md"

permissions:
  contents: read

concurrency:
  group: bizman-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements.runtime.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate structured knowledge
        run: python tools/validate_repo.py

  collector-e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements.runtime.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Run Chrome for Testing E2E
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/BizManData"
          CFT_DIR="$RUNNER_TEMP/chrome-for-testing"
          PROFILE_DIR="$RUNNER_TEMP/bizman-cft-profile"
          FIXTURE_LOG="$RUNNER_TEMP/bizman-fixture.log"
          CHROME_LOG="$RUNNER_TEMP/bizman-chrome.log"
          COLLECTOR_LOG="$RUNNER_TEMP/bizman-collector.log"

          cleanup() {
            if [[ -n "${CHROME_PID:-}" ]]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [[ -n "${FIXTURE_PID:-}" ]]; then kill "$FIXTURE_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          python tools/ci/fixture_server.py >"$FIXTURE_LOG" 2>&1 &
          FIXTURE_PID=$!
          for _ in {1..100}; do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8765/healthz >/dev/null

          CHROME_BIN="$(python tools/ci/download_chrome_for_testing.py --output "$CFT_DIR")"
          mkdir -p "$PROFILE_DIR"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE_DIR" \
            http://127.0.0.1:8765/ >"$CHROME_LOG" 2>&1 &
          CHROME_PID=$!

          for _ in {1..150}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          set +e
          timeout --preserve-status --signal=INT --kill-after=5s 16s \
            python tools/collect_live.py \
              --endpoint http://127.0.0.1:9222 \
              --data-dir "$DATA_DIR" \
              --host 127.0.0.1 \
              >"$COLLECTOR_LOG" 2>&1
          COLLECTOR_EXIT=$?
          set -e
          if [[ "$COLLECTOR_EXIT" -ne 0 && "$COLLECTOR_EXIT" -ne 130 ]]; then
            echo "collector exited with $COLLECTOR_EXIT"
            cat "$COLLECTOR_LOG"
            cat "$CHROME_LOG"
            cat "$FIXTURE_LOG"
            exit "$COLLECTOR_EXIT"
          fi

          python tools/ci/verify_collector_e2e.py --data-dir "$DATA_DIR"
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collector-e2e-debug
          path: |
            ${{ runner.temp }}/bizman-fixture.log
            ${{ runner.temp }}/bizman-chrome.log
            ${{ runner.temp }}/bizman-collector.log
          if-no-files-found: ignore
          retention-days: 3

  benchmark:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install detector benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Run A/B/C storage benchmark
        shell: bash
        run: |
          set -euo pipefail
          python tools/benchmarks/storage_flush.py --events 50000 --repeats 5 \
            | tee "$RUNNER_TEMP/storage-benchmark.json"
      - name: Publish storage benchmark summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "storage-benchmark.json").read_text())
          print("## Storage flush A/B/C benchmark")
          print(f"Implementation: `{data['implementation']}`")
          print("| Variant | Flush every | Median s | events/s | Speedup vs A |")
          print("|---|---:|---:|---:|---:|")
          for name, item in data["variants"].items():
              print(
                  f"| {name} | {item['flush_every_events']} | "
                  f"{item['median_seconds']:.4f} | {item['events_per_second']:.0f} | "
                  f"{item['speedup_vs_A']:.2f}x |"
              )
          PY
      - name: Dump Sonar PR bugs and vulnerabilities (temporary diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode(
              {
                  "componentKeys": "MrFr3di_bizman",
                  "pullRequest": "4",
                  "resolved": "false",
                  "ps": "500",
              }
          )
          url = f"https://sonarcloud.io/api/issues/search?{query}"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          print(f"SONAR_ISSUE_COUNT={payload.get('total')}")
          for issue in payload.get("issues", []):
              impacts = issue.get("impacts") or []
              software_qualities = sorted(
                  {
                      str(impact.get("softwareQuality", ""))
                      for impact in impacts
                      if impact.get("softwareQuality")
                  }
              )
              if issue.get("type") not in {"BUG", "VULNERABILITY"} and not set(
                  software_qualities
              ).intersection({"RELIABILITY", "SECURITY"}):
                  continue
              component = str(issue.get("component", ""))
              prefix = "MrFr3di_bizman:"
              if component.startswith(prefix):
                  component = component[len(prefix):]
              record = {
                  "key": issue.get("key"),
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "type": issue.get("type"),
                  "software_qualities": software_qualities,
                  "component": component,
                  "line": issue.get("line"),
                  "message": issue.get("message"),
              }
              print("SONAR_ISSUE=" + json.dumps(record, sort_keys=True))
          PY
      - name: Run detector matching and streaming benchmark
        id: detector-benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/benchmarks/detector_stream.py \
            --events 100000 \
            --match-requests 100000 \
            --repeats 3 \
            | tee "$RUNNER_TEMP/detector-benchmark.json"
      - name: Publish detector benchmark summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "detector-benchmark.json"
          print("## Detector benchmark (non-gating)")
          if not path.exists():
              print("Detector benchmark did not produce a result file.")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text())
          except (OSError, json.JSONDecodeError) as exc:
              print(f"Detector benchmark result was unreadable: {exc}")
              raise SystemExit(0)
          matching = data["matching"]
          print(
              f"Matcher recommendation: `{matching['recommendation']}` "
              f"(C threshold {matching['trie_consider_threshold']:.2f}x vs B)"
          )
          print("| Variant | Median s | requests/s | Speedup vs B |")
          print("|---|---:|---:|---:|")
          for name, item in matching["variants"].items():
              print(
                  f"| {name} | {item['median_seconds']:.4f} | "
                  f"{item['requests_per_second']:.0f} | {item['speedup_vs_B']:.2f}x |"
              )
          streaming = data["streaming"]
          print("")
          print(
              f"Validated streaming: {streaming['source_events']} source events, "
              f"{streaming['source_events_per_second']:.0f} source events/s, "
              f"{streaming['validation_events_per_second']:.0f} validation events/s, "
              f"peak tracemalloc {streaming['peak_tracemalloc_bytes'] / (1024 * 1024):.2f} MiB."
          )
          PY
