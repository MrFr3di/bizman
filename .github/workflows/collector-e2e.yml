name: collector-quality-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "schemas/**"
      - "config/**"
      - "knowledge/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/CI.md"
      - ".sonarcloud.properties"
      - "sonar-project.properties"

permissions:
  contents: read

concurrency:
  group: bizman-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync locked environment
        run: |
          uv lock --check
          uv sync --locked
      - name: Lint Python sources
        run: uv run ruff check src
      - name: Enforce package architecture
        run: uv run lint-imports
      - name: Compile Python sources
        run: uv run python -m compileall -q src tools tests
      - name: Run unit and contract tests with coverage
        run: |
          uv run --locked --with coverage==7.16.1 coverage run -m unittest discover -s tests -v
          uv run --locked --with coverage==7.16.1 coverage xml
      - name: Upload Python coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Validate structured knowledge
        run: uv run python tools/validate_repo.py
      - name: Run P3 MCP completion evaluation
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/evaluations/mcp_p3.py \
            --output "$RUNNER_TEMP/mcp-p3-evaluation.json"
      - name: Publish P3 MCP evaluation summary
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mcp-p3-evaluation.json"
          print("## P3 MCP completion evaluation")
          if not path.exists():
              print("P3 MCP evaluation did not produce a report.")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"P3 MCP evaluation report was unreadable: {exc}")
              raise SystemExit(0)

          print(f"Overall: **{'PASS' if data['passed'] else 'FAIL'}**")
          print(f"Tools: {data['surface']['tool_count']}")
          print(
              "Retrieval parity: "
              f"{'PASS' if data['retrieval']['passed'] else 'FAIL'}"
          )
          print(
              "Known action trace: "
              f"{data['action_trace']['actions']} actions, "
              f"max {data['action_trace']['max_calls']} calls"
          )
          print(
              "Evidence/session median calls: "
              f"{data['common_tasks']['median_calls_evidence_session']:.1f}"
          )
          print(
              "Result sizes: compact max "
              f"{data['surface']['compact_max_bytes']} B; "
              f"standard max {data['surface']['standard_max_bytes']} B"
          )
          print(
              "Installed stdio: "
              f"{'PASS' if data['stdio']['passed'] else 'FAIL'}"
          )
          print("")
          print("| Corpus | Recall@1 | Recall@5 | MRR | Evidence | No-match |")
          print("|---|---:|---:|---:|---:|---:|")
          for name, item in data["retrieval"]["corpora"].items():
              no_match = item["no_match_accuracy"]
              rendered_no_match = (
                  "n/a" if no_match is None else f"{no_match:.3f}"
              )
              print(
                  f"| {name} | {item['recall_at_1']:.3f} | "
                  f"{item['recall_at_5']:.3f} | {item['mrr']:.3f} | "
                  f"{item['evidence_correctness']:.3f} | "
                  f"{rendered_no_match} |"
              )
          PY
      - name: Upload P3 MCP evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-p3-evaluation
          path: ${{ runner.temp }}/mcp-p3-evaluation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnose public SonarQube Cloud PR bugs
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --get \
            --data-urlencode "componentKeys=MrFr3di_bizman" \
            --data-urlencode "pullRequest=$PR_NUMBER" \
            --data-urlencode "resolved=false" \
            --data-urlencode "types=BUG" \
            --data-urlencode "ps=100" \
            https://sonarcloud.io/api/issues/search \
            | uv run python -c '
          import json, sys
          payload = json.load(sys.stdin)
          print(json.dumps([
              {
                  "rule": item.get("rule"),
                  "severity": item.get("severity"),
                  "message": item.get("message"),
                  "component": item.get("component"),
                  "line": item.get("line"),
                  "status": item.get("status"),
              }
              for item in payload.get("issues", [])
          ], ensure_ascii=False, indent=2))
          '

      - name: Validate SonarQube Cloud CI configuration
        if: ${{ vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SONAR_ORGANIZATION:-}" || {
            echo "SONAR_ORGANIZATION repository variable is required when SONAR_CI_ENABLED=true" >&2
            exit 1
          }
          test -n "${SONAR_TOKEN:-}" || {
            echo "SONAR_TOKEN repository secret is required when SONAR_CI_ENABLED=true" >&2
            exit 1
          }
      - name: Run SonarQube Cloud analysis
        if: ${{ vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Compile installable package
        run: uv run python -m compileall -q src
      - name: Run Python floor contract smoke
        run: |
          uv run python -m unittest discover -s tests -p "test_core_*.py" -v
          uv run python -m unittest discover -s tests -p "test_current_*.py" -v
          uv run python -m unittest discover -s tests -p "test_p4b_response_capture.py" -v
          uv run python -m unittest discover -s tests -p "test_mcp_*.py" -v
          uv run python -m unittest discover -s tests -p "test_package_migration_contract.py" -v
          uv run python -m unittest discover -s tests -p "test_cli_parity.py" -v
      - name: Import and CLI smoke
        run: |
          uv run python - <<'PY'
          import bizman
          import bizman.changes
          import bizman.collector
          import bizman.core
          import bizman.current
          import bizman.foundation
          import bizman.mcp
          import bizman.readmodel
          import bizman.sessions
          print(bizman.__file__)
          PY
          uv run bizman --help
          uv run bizman-mcp --help

  collector-e2e:
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run Chrome for Testing E2E
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/BizManData"
          CFT_DIR="$RUNNER_TEMP/chrome-for-testing"
          PROFILE_DIR="$RUNNER_TEMP/bizman-cft-profile"
          FIXTURE_LOG="$RUNNER_TEMP/bizman-fixture.log"
          CHROME_LOG="$RUNNER_TEMP/bizman-chrome.log"
          COLLECTOR_LOG="$RUNNER_TEMP/bizman-collector.log"

          cleanup() {
            if [[ -n "${CHROME_PID:-}" ]]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [[ -n "${FIXTURE_PID:-}" ]]; then kill "$FIXTURE_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run python tools/ci/fixture_server.py >"$FIXTURE_LOG" 2>&1 &
          FIXTURE_PID=$!
          for _ in {1..100}; do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8765/healthz >/dev/null

          CHROME_BIN="$(uv run python tools/ci/download_chrome_for_testing.py --output "$CFT_DIR")"
          mkdir -p "$PROFILE_DIR"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE_DIR" \
            http://127.0.0.1:8765/ >"$CHROME_LOG" 2>&1 &
          CHROME_PID=$!

          for _ in {1..150}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          set +e
          # Allow WebSocket close handshake and finally: manifest finalization after SIGINT.
          timeout --preserve-status --signal=INT --kill-after=15s 16s \
            uv run python tools/collect_live.py \
              --endpoint http://127.0.0.1:9222 \
              --data-dir "$DATA_DIR" \
              --host 127.0.0.1 \
              >"$COLLECTOR_LOG" 2>&1
          COLLECTOR_EXIT=$?
          set -e
          if [[ "$COLLECTOR_EXIT" -ne 0 && "$COLLECTOR_EXIT" -ne 130 ]]; then
            echo "collector exited with $COLLECTOR_EXIT"
            cat "$COLLECTOR_LOG"
            cat "$CHROME_LOG"
            cat "$FIXTURE_LOG"
            exit "$COLLECTOR_EXIT"
          fi

          uv run python tools/ci/verify_collector_e2e.py --data-dir "$DATA_DIR"
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collector-e2e-debug
          path: |
            ${{ runner.temp }}/bizman-fixture.log
            ${{ runner.temp }}/bizman-chrome.log
            ${{ runner.temp }}/bizman-collector.log
            ${{ runner.temp }}/BizManData
          if-no-files-found: ignore
          retention-days: 3

  benchmark:
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run A/B/C storage benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/benchmarks/storage_flush.py --events 50000 --repeats 5 \
            | tee "$RUNNER_TEMP/storage-benchmark.json"
      - name: Publish storage benchmark summary
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "storage-benchmark.json").read_text())
          print("## Storage flush A/B/C benchmark")
          print(f"Implementation: `{data['implementation']}`")
          print("| Variant | Flush every | Median s | events/s | Speedup vs A |")
          print("|---|---:|---:|---:|---:|")
          for name, item in data["variants"].items():
              print(
                  f"| {name} | {item['flush_every_events']} | "
                  f"{item['median_seconds']:.4f} | {item['events_per_second']:.0f} | "
                  f"{item['speedup_vs_A']:.2f}x |"
              )
          PY
      - name: Run Agent Index/Core benchmark
        id: readmodel-benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/benchmarks/readmodel_core.py \
            --repeats 5 \
            --small-sessions 20 \
            --small-changes 40 \
            --large-sessions 200 \
            --large-changes 400 \
            | tee "$RUNNER_TEMP/readmodel-benchmark.json"
      - name: Publish Agent Index/Core benchmark summary
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "readmodel-benchmark.json"
          print("## Agent Index / Core benchmark (non-gating)")
          if not path.exists():
              print("Read-model benchmark did not produce a result file.")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text())
          except (OSError, json.JSONDecodeError) as exc:
              print(f"Read-model benchmark result was unreadable: {exc}")
              raise SystemExit(0)

          evaluation = data["evaluation"]
          v3 = evaluation["corpora"]["v3"]
          print(
              f"Retrieval decision: \`{evaluation['decision']}\`; "
              f"v3 overall accuracy {v3['overall_accuracy']:.3f}, "
              f"Recall@1 {v3['recall_at_1']:.3f}, "
              f"Recall@5 {v3['recall_at_5']:.3f}, "
              f"evidence {v3['evidence_correctness']:.3f}, "
              f"no-match {v3['no_match_accuracy']:.3f}."
          )
          print("")
          print("| Operation | Cold Core p50 ms | Cold p95 ms | Warm index p50 ms | Warm p95 ms |")
          print("|---|---:|---:|---:|---:|")
          cold = data["latency"]["cold_core"]
          warm = data["latency"]["warm_index"]
          for name in cold:
              print(
                  f"| {name} | {cold[name]['p50_ms']:.3f} | "
                  f"{cold[name]['p95_ms']:.3f} | "
                  f"{warm[name]['p50_ms']:.3f} | {warm[name]['p95_ms']:.3f} |"
              )
          integrity = data["latency"]["integrity_open"]
          print("")
          print(
              f"Fresh index validation: p50 {integrity['p50_ms']:.3f} ms, "
              f"p95 {integrity['p95_ms']:.3f} ms."
          )
          print("")
          print("| Rebuild | Sessions | Changes | Seconds | DB MiB | Peak tracemalloc MiB |")
          print("|---|---:|---:|---:|---:|---:|")
          for name, item in data["rebuild"].items():
              print(
                  f"| {name} | {item['sessions']} | {item['changes']} | "
                  f"{item['elapsed_seconds']:.3f} | "
                  f"{item['database_bytes'] / (1024 * 1024):.2f} | "
                  f"{item['peak_tracemalloc_bytes'] / (1024 * 1024):.2f} |"
              )
          print("")
          print("Representative serialized Core result sizes:")
          for name, size in data["serialized_result_bytes"].items():
              print(f"- \`{name}\`: {size} bytes")
          PY
      - name: Upload Agent Index/Core benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readmodel-benchmark
          path: ${{ runner.temp }}/readmodel-benchmark.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Run detector matching and streaming benchmark
        id: detector-benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/benchmarks/detector_stream.py \
            --events 100000 \
            --match-requests 100000 \
            --repeats 3 \
            | tee "$RUNNER_TEMP/detector-benchmark.json"
      - name: Publish detector benchmark summary
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "detector-benchmark.json"
          print("## Detector benchmark (non-gating)")
          if not path.exists():
              print("Detector benchmark did not produce a result file.")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text())
          except (OSError, json.JSONDecodeError) as exc:
              print(f"Detector benchmark result was unreadable: {exc}")
              raise SystemExit(0)
          matching = data["matching"]
          print(
              f"Matcher recommendation: `{matching['recommendation']}` "
              f"(C threshold {matching['trie_consider_threshold']:.2f}x vs B)"
          )
          print("| Variant | Median s | requests/s | Speedup vs B |")
          print("|---|---:|---:|---:|")
          for name, item in matching["variants"].items():
              print(
                  f"| {name} | {item['median_seconds']:.4f} | "
                  f"{item['requests_per_second']:.0f} | {item['speedup_vs_B']:.2f}x |"
              )
          streaming = data["streaming"]
          print("")
          print(
              f"Validated streaming: {streaming['source_events']} source events, "
              f"{streaming['source_events_per_second']:.0f} source events/s, "
              f"{streaming['validation_events_per_second']:.0f} validation events/s, "
              f"peak tracemalloc {streaming['peak_tracemalloc_bytes'] / (1024 * 1024):.2f} MiB."
          )
          PY