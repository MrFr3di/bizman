name: temporary-baseline-trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/change-detector-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout detector branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/change-detector-v1
          fetch-depth: 1
      - name: Apply reviewed patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/bizman_detector/baseline.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def find_exact(value: str, start: int = 0) -> int:
              matches = [i for i in range(start, len(lines)) if lines[i] == value]
              if len(matches) != 1:
                  raise SystemExit(f'expected one {value!r}, got {len(matches)}')
              return matches[0]

          op_start = find_exact('def _operations(')
          op_end = next(
              i for i in range(op_start, len(lines))
              if lines[i] == ') -> tuple[OperationSignature, ...]:'
          )
          expected_signature = [
              'def _operations(',
              '    value: Any,',
              '    *,',
              '    source: str,',
              '    redaction: RedactionPolicy,',
              '    matcher: PathMatcher,',
              '    methods_by_pattern: Mapping[str, frozenset[str]],',
              ') -> tuple[OperationSignature, ...]:',
          ]
          if lines[op_start:op_end + 1] != expected_signature:
              raise SystemExit('unexpected _operations signature')
          replacement = [
              'def _operation_path(',
              '    raw_path: object,',
              '    *,',
              '    source: str,',
              '    matcher: PathMatcher,',
              ') -> str:',
              '    try:',
              '        path = normalize_origin_relative_path(raw_path)',
              '        match = matcher.match(path)',
              '    except ValueError as exc:',
              '        raise BaselineFormatError(f"{source}: invalid operation path") from exc',
              '    except AmbiguousPathError as exc:',
              '        raise BaselineConsistencyError(',
              '            f"{source}: operation path {path!r} is ambiguous in endpoint census"',
              '        ) from exc',
              '    if match.matched and match.path_pattern is not None:',
              '        return match.path_pattern',
              '    return path',
              '',
              '',
              'def _operations(',
              '    value: Any,',
              '    *,',
              '    source: str,',
              '    redaction: RedactionPolicy,',
              '    matcher: PathMatcher,',
              ') -> tuple[OperationSignature, ...]:',
          ]
          lines[op_start:op_end + 1] = replacement

          op_start = find_exact('def _operations(')
          actions_start = find_exact('def _actions(', op_start + 1)
          path_hits = [
              i for i in range(op_start, actions_start)
              if lines[i].strip() == 'path_pattern=_known_endpoint('
          ]
          if len(path_hits) != 1:
              raise SystemExit(f'expected one operation path mapping, got {len(path_hits)}')
          path_start = path_hits[0]
          expected_call = [
              '                path_pattern=_known_endpoint(',
              '                    item.get("path"),',
              '                    method="POST",',
              '                    source=item_source,',
              '                    matcher=matcher,',
              '                    methods_by_pattern=methods_by_pattern,',
              '                ),',
          ]
          if lines[path_start:path_start + len(expected_call)] != expected_call:
              raise SystemExit('unexpected operation endpoint mapping')
          lines[path_start:path_start + len(expected_call)] = [
              '                path_pattern=_operation_path(',
              '                    item.get("path"),',
              '                    source=item_source,',
              '                    matcher=matcher,',
              '                ),',
          ]

          actions_start = find_exact('def _actions(', op_start + 1)
          helper = [
              'def _merge_operation_endpoints(',
              '    endpoints: tuple[EndpointFamily, ...],',
              '    operations: tuple[OperationSignature, ...],',
              ') -> tuple[EndpointFamily, ...]:',
              '    variants_by_path: dict[str, dict[str, set[EndpointVariant]]] = {}',
              '    for endpoint in endpoints:',
              '        variants_by_path[endpoint.path_pattern] = {',
              '            method.method: set(method.variants) for method in endpoint.methods',
              '        }',
              '',
              '    for operation in operations:',
              '        methods = variants_by_path.setdefault(operation.path_pattern, {})',
              '        variants = methods.setdefault(operation.method, set())',
              '        variants.update(',
              '            EndpointVariant(query_keys=operation.query_keys, status=status)',
              '            for status in operation.statuses',
              '        )',
              '',
              '    return tuple(',
              '        EndpointFamily(',
              '            path_pattern=path_pattern,',
              '            methods=tuple(',
              '                EndpointMethodContract(',
              '                    method=method,',
              '                    variants=tuple(sorted(variants)),',
              '                )',
              '                for method, variants in sorted(methods.items())',
              '            ),',
              '        )',
              '        for path_pattern, methods in sorted(variants_by_path.items())',
              '    )',
              '',
              '',
          ]
          lines[actions_start:actions_start] = helper

          compile_class = find_exact('class BaselineCompiler:')
          endpoint_line = next(
              i for i in range(compile_class, len(lines))
              if lines[i].strip() == 'endpoints = _endpoint_families(aggregates, application_events, redaction)'
          )
          block_start = next(
              i for i in range(endpoint_line + 1, len(lines))
              if lines[i].strip() == 'matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)'
          )
          action_path = next(
              i for i in range(block_start, len(lines))
              if lines[i].strip() == 'action_path = root / "knowledge/actions/catalog.json"'
          )
          lines[block_start:action_path] = [
              '        matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)',
              '        forms = _forms(form_records, redaction, matcher)',
              '',
              '        operation_path = root / "knowledge/http/operation-index.json"',
              '        operations = _operations(',
              '            _load_json(operation_path, repo_root=root),',
              '            source=_source_label(root, operation_path),',
              '            redaction=redaction,',
              '            matcher=matcher,',
              '        )',
              '        endpoints = _merge_operation_endpoints(endpoints, operations)',
              '        matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)',
              '        methods_by_pattern = {',
              '            endpoint.path_pattern: frozenset(method.method for method in endpoint.methods)',
              '            for endpoint in endpoints',
              '        }',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('tests/test_detector_baseline.py')
          tests = test_path.read_text(encoding='utf-8')
          for old, new in (
              ('        self.assertEqual(len(contract.endpoints), 68)\n', '        self.assertEqual(len(contract.endpoints), 71)\n'),
              ('        self.assertEqual(len(contract.actions), 8)\n', '        self.assertEqual(len(contract.actions), 11)\n'),
          ):
              if tests.count(old) != 1:
                  raise SystemExit(f'expected one repository assertion {old!r}')
              tests = tests.replace(old, new, 1)
          new_test = '''

class OperationOnlyEndpointContractTests(unittest.TestCase):
    def test_operation_only_path_extends_post_endpoint_contract(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            _write_fixture(root)
            operation_path = root / "knowledge/http/operation-index.json"
            payload = json.loads(operation_path.read_text(encoding="utf-8"))
            payload["operations"].append(
                {
                    "id": "op-live-only",
                    "path": "/operation-only/",
                    "query_keys": ["id"],
                    "body_keys": ["amount"],
                    "observations": [{"status": 200}],
                    "count": 1,
                }
            )
            payload["post_count"] += 1
            _dump(operation_path, payload)

            contract = BaselineCompiler.compile(root, RedactionPolicy.default()).contract

            operation = next(
                item for item in contract.operations
                if item.path_pattern == "/operation-only/"
            )
            self.assertEqual(operation.method, "POST")
            family = next(
                item for item in contract.endpoints
                if item.path_pattern == "/operation-only/"
            )
            post = next(item for item in family.methods if item.method == "POST")
            self.assertEqual(post.statuses, (200,))
            self.assertEqual(post.query_key_sets, (("id",),))
'''
          marker = '\n\nif __name__ == "__main__":\n'
          if tests.count(marker) != 1:
              raise SystemExit('test insertion anchor missing')
          tests = tests.replace(marker, new_test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m compileall -q tools/bizman_detector/baseline.py tests/test_detector_baseline.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/bizman_detector/baseline.py tests/test_detector_baseline.py
          git rm .github/workflows/temporary-baseline-patch.yml .github/workflows/temporary-baseline-trigger.yml
          git commit -m 'Integrate observed live operations into runtime contract'
          git push origin HEAD:feature/change-detector-v1
