name: p3-lock-bootstrap

on:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/p3-lock-bootstrap.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Refresh lock
        run: uv lock
      - name: Upload lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
