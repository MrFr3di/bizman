name: p1-changes-migration

on:
  pull_request:
    paths:
      - ".github/workflows/p1-changes-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Migrate detector implementation mechanically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/bizman/changes/rules
          for file in tools/bizman_detector/*.py; do
            case "$(basename "$file")" in
              evidence.py|session_status.py) continue ;;
            esac
            cp "$file" "src/bizman/changes/$(basename "$file")"
          done
          cp tools/bizman_detector/rules/*.py src/bizman/changes/rules/
          python - <<'PY'
          from pathlib import Path

          root = Path("src/bizman/changes")
          for path in sorted(root.rglob("*.py")):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "tools.bizman_detector.evidence",
                  "bizman.sessions.evidence",
              )
              text = text.replace(
                  "tools.bizman_detector.session_status",
                  "bizman.sessions.status",
              )
              text = text.replace("tools.bizman_detector.", "bizman.changes.")
              text = text.replace("tools.bizman_foundation.", "bizman.foundation.")
              if "from tools." in text or "import tools." in text:
                  raise SystemExit(f"canonical changes still imports tools namespace: {path}")
              path.write_text(text, encoding="utf-8")

          shim_template = '''\"\"\"Compatibility shim for canonical {canonical}.\"\"\"\n\nfrom importlib import import_module as _import_module\n\nfrom {canonical} import *  # noqa: F401,F403\n\n_canonical = _import_module(\"{canonical}\")\n\n\ndef __getattr__(name: str):\n    return getattr(_canonical, name)\n\n\ndef __dir__():\n    return sorted(set(globals()) | set(dir(_canonical)))\n\n\n__all__ = getattr(\n    _canonical,\n    \"__all__\",\n    tuple(name for name in dir(_canonical) if not name.startswith(\"_\")),\n)\n'''

          legacy = Path("tools/bizman_detector")
          for path in sorted(legacy.glob("*.py")):
              if path.name in {"evidence.py", "session_status.py"}:
                  continue
              if path.name == "__init__.py":
                  path.write_text(shim_template.format(canonical="bizman.changes"), encoding="utf-8")
                  continue
              path.write_text(
                  shim_template.format(canonical=f"bizman.changes.{path.stem}"),
                  encoding="utf-8",
              )
          rules = legacy / "rules"
          for path in sorted(rules.glob("*.py")):
              canonical = "bizman.changes.rules"
              if path.name != "__init__.py":
                  canonical += f".{path.stem}"
              path.write_text(shim_template.format(canonical=canonical), encoding="utf-8")
          PY
          if grep -R -n -E '(^|[[:space:]])(from|import)[[:space:]]+tools([.]|$)' src/bizman/changes; then
            echo "canonical changes package imports tools namespace"
            exit 1
          fi
          test ! -e src/bizman/changes/evidence.py
          test ! -e src/bizman/changes/session_status.py
      - name: Verify migration under locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -m compileall -q src tools tests
          uv run python -m unittest discover -s tests -v
          uv run python tools/validate_repo.py
      - name: Commit verified changes migration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-changes-migration.yml
          git add src/bizman/changes tools/bizman_detector
          git commit -m "refactor: migrate detector into changes package"
          git push origin HEAD:${{ github.head_ref }}
