name: package-lock-bootstrap

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/package-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Generate lock
        run: uv lock
      - name: Verify exact lock
        run: uv lock --check
      - name: Upload lock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
