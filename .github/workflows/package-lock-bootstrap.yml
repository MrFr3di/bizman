name: package-lock-bootstrap

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Generate and verify exact lock
        run: |
          set -euo pipefail
          rm -f uv.lock
          uv lock
          uv lock --check
          python - <<'PY'
          from pathlib import Path
          import tomllib
          value = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          packages = {item["name"]: item for item in value["package"]}
          assert value["requires-python"] == ">=3.11"
          assert packages["jsonschema"]["version"] == "4.26.0"
          assert packages["websockets"]["version"] == "17.1"
          assert packages["ruff"]["version"] == "0.16.3"
          assert packages["import-linter"]["version"] == "2.15"
          for name, package in packages.items():
              source = package.get("source", {})
              if name == "bizman":
                  assert source == {"editable": "."}
              else:
                  assert source.get("registry") == "https://pypi.org/simple", (name, source)
          PY
      - name: Commit lock and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package-lock-bootstrap.yml
          git add uv.lock
          git commit -m "build: lock python dependency graph with uv 0.12.10"
          git push origin HEAD:${{ github.head_ref }}
