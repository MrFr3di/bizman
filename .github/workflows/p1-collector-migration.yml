name: p1-collector-migration

on:
  pull_request:
    paths:
      - ".github/workflows/p1-collector-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Migrate collector implementation mechanically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/bizman/collector
          cp tools/bizman_collector/*.py src/bizman/collector/
          python - <<'PY'
          from pathlib import Path

          root = Path("src/bizman/collector")
          for path in sorted(root.glob("*.py")):
              text = path.read_text(encoding="utf-8")
              text = text.replace("tools.bizman_collector.", "bizman.collector.")
              text = text.replace("tools.bizman_foundation.", "bizman.foundation.")
              if "from tools." in text or "import tools." in text:
                  raise SystemExit(f"canonical collector still imports tools namespace: {path}")
              path.write_text(text, encoding="utf-8")

          shim_template = '''\"\"\"Compatibility shim for canonical {canonical}.\"\"\"\n\nfrom importlib import import_module as _import_module\n\nfrom {canonical} import *  # noqa: F401,F403\n\n_canonical = _import_module(\"{canonical}\")\n\n\ndef __getattr__(name: str):\n    return getattr(_canonical, name)\n\n\ndef __dir__():\n    return sorted(set(globals()) | set(dir(_canonical)))\n\n\n__all__ = getattr(\n    _canonical,\n    \"__all__\",\n    tuple(name for name in dir(_canonical) if not name.startswith(\"_\")),\n)\n'''
          legacy = Path("tools/bizman_collector")
          for path in sorted(legacy.glob("*.py")):
              if path.name == "__init__.py":
                  path.write_text(
                      '\"\"\"Compatibility package for canonical ``bizman.collector``.\"\"\"\n',
                      encoding="utf-8",
                  )
                  continue
              canonical = f"bizman.collector.{path.stem}"
              path.write_text(shim_template.format(canonical=canonical), encoding="utf-8")
          PY
          if grep -R -n -E '(^|[[:space:]])(from|import)[[:space:]]+tools([.]|$)' src/bizman/collector; then
            echo "canonical collector package imports tools namespace"
            exit 1
          fi
      - name: Verify migration under locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -m compileall -q src tools tests
          uv run python -m unittest discover -s tests -v
          uv run python tools/validate_repo.py
      - name: Commit verified collector migration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-collector-migration.yml
          git add src/bizman/collector tools/bizman_collector
          git commit -m "refactor: migrate collector into package"
          git push origin HEAD:${{ github.head_ref }}
