name: temporary-baseline-patch

on:
  push:
    branches:
      - feature/change-detector-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/change-detector-v1
          fetch-depth: 1
      - name: Apply reviewed baseline integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/bizman_detector/baseline.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _operations(
              value: Any,
              *,
              source: str,
              redaction: RedactionPolicy,
              matcher: PathMatcher,
              methods_by_pattern: Mapping[str, frozenset[str]],
          ) -> tuple[OperationSignature, ...]:
          '''
          new = '''def _operation_path(
              raw_path: object,
              *,
              source: str,
              matcher: PathMatcher,
          ) -> str:
              try:
                  path = normalize_origin_relative_path(raw_path)
                  match = matcher.match(path)
              except ValueError as exc:
                  raise BaselineFormatError(f"{source}: invalid operation path") from exc
              except AmbiguousPathError as exc:
                  raise BaselineConsistencyError(
                      f"{source}: operation path {path!r} is ambiguous in endpoint census"
                  ) from exc
              if match.matched and match.path_pattern is not None:
                  return match.path_pattern
              return path


          def _operations(
              value: Any,
              *,
              source: str,
              redaction: RedactionPolicy,
              matcher: PathMatcher,
          ) -> tuple[OperationSignature, ...]:
          '''
          if old not in text:
              raise SystemExit('operations signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''                path_pattern=_known_endpoint(
                      item.get("path"),
                      method="POST",
                      source=item_source,
                      matcher=matcher,
                      methods_by_pattern=methods_by_pattern,
                  ),
          '''
          new = '''                path_pattern=_operation_path(
                      item.get("path"),
                      source=item_source,
                      matcher=matcher,
                  ),
          '''
          if old not in text:
              raise SystemExit('operation path anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    return tuple(sorted(signatures))


          def _actions(
          '''
          replacement = '''    return tuple(sorted(signatures))


          def _merge_operation_endpoints(
              endpoints: tuple[EndpointFamily, ...],
              operations: tuple[OperationSignature, ...],
          ) -> tuple[EndpointFamily, ...]:
              variants_by_path: dict[str, dict[str, set[EndpointVariant]]] = {}
              for endpoint in endpoints:
                  variants_by_path[endpoint.path_pattern] = {
                      method.method: set(method.variants) for method in endpoint.methods
                  }

              for operation in operations:
                  methods = variants_by_path.setdefault(operation.path_pattern, {})
                  variants = methods.setdefault(operation.method, set())
                  variants.update(
                      EndpointVariant(query_keys=operation.query_keys, status=status)
                      for status in operation.statuses
                  )

              return tuple(
                  EndpointFamily(
                      path_pattern=path_pattern,
                      methods=tuple(
                          EndpointMethodContract(
                              method=method,
                              variants=tuple(sorted(variants)),
                          )
                          for method, variants in sorted(methods.items())
                      ),
                  )
                  for path_pattern, methods in sorted(variants_by_path.items())
              )


          def _actions(
          '''
          if anchor not in text:
              raise SystemExit('operation merge insertion anchor not found')
          text = text.replace(anchor, replacement, 1)

          old = '''        matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)
                  methods_by_pattern = {
                      endpoint.path_pattern: frozenset(method.method for method in endpoint.methods)
                      for endpoint in endpoints
                  }
                  forms = _forms(form_records, redaction, matcher)

                  operation_path = root / "knowledge/http/operation-index.json"
                  operations = _operations(
                      _load_json(operation_path, repo_root=root),
                      source=_source_label(root, operation_path),
                      redaction=redaction,
                      matcher=matcher,
                      methods_by_pattern=methods_by_pattern,
                  )
                  action_path = root / "knowledge/actions/catalog.json"
          '''
          new = '''        matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)
                  forms = _forms(form_records, redaction, matcher)

                  operation_path = root / "knowledge/http/operation-index.json"
                  operations = _operations(
                      _load_json(operation_path, repo_root=root),
                      source=_source_label(root, operation_path),
                      redaction=redaction,
                      matcher=matcher,
                  )
                  endpoints = _merge_operation_endpoints(endpoints, operations)
                  matcher = PathMatcher(endpoint.path_pattern for endpoint in endpoints)
                  methods_by_pattern = {
                      endpoint.path_pattern: frozenset(method.method for method in endpoint.methods)
                      for endpoint in endpoints
                  }
                  action_path = root / "knowledge/actions/catalog.json"
          '''
          if old not in text:
              raise SystemExit('compile ordering anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_detector_baseline.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''    def test_action_family_is_value_free_and_uses_endpoint_pattern(self):
          '''
          insertion = '''    def test_operation_only_path_extends_post_endpoint_contract(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      _write_fixture(root)
                      operation_path = root / "knowledge/http/operation-index.json"
                      payload = json.loads(operation_path.read_text(encoding="utf-8"))
                      payload["operations"].append(
                          {
                              "id": "op-live-only",
                              "path": "/operation-only/",
                              "query_keys": ["id"],
                              "body_keys": ["amount"],
                              "observations": [{"status": 200}],
                              "count": 1,
                          }
                      )
                      _dump(operation_path, payload)

                      compilation = BaselineCompiler.compile(root, self.policy)

                      operation = next(
                          item
                          for item in compilation.contract.operations
                          if item.path_pattern == "/operation-only/"
                      )
                      self.assertEqual(operation.method, "POST")
                      family = next(
                          item
                          for item in compilation.contract.endpoints
                          if item.path_pattern == "/operation-only/"
                      )
                      post = next(item for item in family.methods if item.method == "POST")
                      self.assertEqual(post.statuses, (200,))
                      self.assertEqual(post.query_key_sets, (("id",),))

              def test_action_family_is_value_free_and_uses_endpoint_pattern(self):
          '''
          if anchor not in tests:
              raise SystemExit('baseline test insertion anchor not found')
          tests = tests.replace(anchor, insertion, 1)
          tests = tests.replace(
              '        self.assertEqual(len(contract.endpoints), 68)\n',
              '        self.assertGreaterEqual(len(contract.endpoints), 68)\n',
              1,
          )
          tests = tests.replace(
              '        self.assertEqual(len(contract.actions), 8)\n',
              '        self.assertGreaterEqual(len(contract.actions), 8)\n',
              1,
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m compileall -q tools/bizman_detector/baseline.py tests/test_detector_baseline.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/bizman_detector/baseline.py tests/test_detector_baseline.py
          git rm .github/workflows/temporary-baseline-patch.yml
          git commit -m 'Integrate observed live operations into runtime contract'
          git push origin HEAD:feature/change-detector-v1
